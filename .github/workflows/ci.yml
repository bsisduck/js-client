name: CI

# The SDK source of truth lives in sdks/js of bsisduck/tracepath. This repo
# is the storefront + release CI. Once packages/ is mirrored here, the
# build/test/publish-ready jobs run for real; until then they skip cleanly.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (repo storefront checks)
    runs-on: ubuntu-latest
    outputs:
      has_workspace: ${{ steps.detect.outputs.has_workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect mirrored npm workspace
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "has_workspace=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_workspace=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Required files exist
        run: |
          for f in README.md LICENSE CONTRIBUTING.md; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done
      - name: README sanity (install cmd + ingest URL + license badge)
        run: |
          grep -q "npm install @tracepath/" README.md
          grep -q "ingest.tracepath.dev" README.md
          grep -q "badge/license-MIT" README.md
      - name: LICENSE is MIT with upstream attribution
        run: grep -q "dusanstanojeviccs" LICENSE
      - name: Package table points at real monorepo paths
        run: |
          # every sdks/js path linked in the README must match a package dir
          # in the main repo (checked locally via gh; monorepo is private, so
          # anonymous HTTP probes would 404 — validate structure instead)
          paths=$(grep -o 'sdks/js/packages/[a-z-]*' README.md | sort -u | sed 's|sdks/js/packages/||')
          [ -n "$paths" ] || { echo "no package links found"; exit 1; }
          expected="backend bundler-plugin core frontend jquery nestjs react react-native sourcemap-upload svelte vue"
          for p in $paths; do
            case " $expected " in
              *" $p "*) echo "ok: $p" ;;
              *) echo "unknown package link: $p"; exit 1 ;;
            esac
          done

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    if: needs.lint.outputs.has_workspace == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build all packages
        run: npm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint, build]
    if: needs.lint.outputs.has_workspace == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build (tests import dist/)
        run: npm run build
      - name: Run tests
        run: npm test

  publish-ready:
    name: Publish readiness check
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: needs.lint.outputs.has_workspace == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci
      - name: Build all packages
        run: npm run build
      - name: Dry-run publish (no actual publish)
        run: |
          for pkg in packages/*/; do
            name=$(node -p "require('./${pkg}package.json').name")
            private=$(node -p "require('./${pkg}package.json').private || false")
            if [ "$private" = "true" ]; then
              echo "skip private package $name"
              continue
            fi
            echo "checking $name"
            npm publish --dry-run --access public -w "$name" 2>&1 | tail -5
          done
